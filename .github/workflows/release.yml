name: Release

# Changesets release flow:
#   1. PRs land on main with a changeset (see CONTRIBUTING.md).
#   2. This workflow opens/updates a "Version Packages" PR that bumps the
#      three linked packages and assembles the changelog.
#   3. Merging that PR runs `pnpm release`, which builds and publishes the
#      packages to npm. Publishing to npm is what makes the jsDelivr / unpkg
#      CDN URLs live — no separate CDN step is needed.
#
# Auth: npm Trusted Publishing (OIDC). No NPM_TOKEN secret is stored; the
# `id-token: write` permission lets the runner mint a short-lived token.
# Provenance is enabled via the NPM_CONFIG_PROVENANCE env var on the publish
# step (not via publishConfig — that would break local `pnpm publish`, which
# has no OIDC provider). In CI the provider is present, so each publish is
# stamped with a verifiable link back to this workflow + commit. The trusted
# publisher must be configured once on npmjs.com for each package
# (Settings → Trusted Publisher → GitHub Actions → magicpages/kalotyp,
# workflow `release.yml`).

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version PR / publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the Version PR, tags, and GitHub Release
      pull-requests: write # open/update the Version PR
      id-token: write # OIDC for npm Trusted Publishing + provenance
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # Trusted Publishing needs a recent npm. Node 22 ships one new enough,
      # but pin-bump defensively so provenance + OIDC are always available.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Build
        run: pnpm build

      - name: Create Version PR or publish
        id: changesets
        # Pinned to v1 deliberately. changesets/action v2 requires Changesets
        # CLI v3 and renamed every input (version -> version-script, publish ->
        # publish-script, commit -> commit-message, title -> pr-title); this repo
        # is on CLI 2.31.0, so v2 fails the job outright. Move to v2 only as part
        # of the CLI v3 upgrade, renaming the inputs below in the same change.
        uses: changesets/action@v1
        with:
          # `pnpm run …`, not `pnpm version` — the latter is pnpm's built-in
          # version command (it just prints versions) and would never run the
          # changeset-version script, leaving the Version PR with an empty diff.
          version: pnpm run version
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OIDC is present in CI, so provenance can be generated here. (Locally
          # this is left unset / false, since a local publish has no provider.)
          NPM_CONFIG_PROVENANCE: "true"

      # Attach the built bundle to the GitHub Release for the `@magicpages/kalotyp`
      # package. The documented setup is "upload the JS + CSS in Ghost's
      # Settings → Integrations", so the release page must carry those two files
      # directly (npm/jsDelivr already have them, but a plain download link is
      # what the upload flow needs). `pnpm run release` (above) rebuilt dist just
      # before publishing, so these are the exact artifacts that went to npm.
      # Only runs when a publish actually happened (i.e. the Version PR merged),
      # and the matching `@magicpages/kalotyp@<version>` release already exists
      # (changesets/action created it in the step above).
      - name: Attach kalotyp.js + kalotyp.css to the GitHub Release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./packages/ghost/package.json').version")"
          tag="@magicpages/kalotyp@${version}"
          gh release upload "$tag" \
            packages/ghost/dist/kalotyp.js \
            packages/ghost/dist/kalotyp.css \
            --clobber
          # The @magicpages/kalotyp bundle is the artifact users download and
          # upload into Ghost, so mark ITS release "Latest". Changesets publishes
          # a release per linked package and GitHub would otherwise flag the
          # last-created one (@magicpages/kalotyp-ui — source only, no JS/CSS) as
          # Latest, so anyone landing on the Releases page wouldn't see the files.
          gh release edit "$tag" --latest
